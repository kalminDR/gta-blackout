name: collect

on:
  schedule:
    # Once an hour, at 37 minutes past -- deliberately not on the hour.
    #
    # This was "0 * * * *" until 27 September 2026. GitHub's scheduler is
    # best-effort and the top of the hour is its most congested slot; from
    # 13 September it started this job only every four to six hours, and did
    # so for two weeks while every run reported success. Moving off :00 is
    # GitHub's own advice and costs nothing, but it is not a guarantee, which
    # is why this schedule is now only the fallback: the primary clock is an
    # external Cloudflare cron (heartbeat.js) that calls workflow_dispatch at
    # five past each hour. When both fire in one hour, the gate below makes
    # this one stand down.
    - cron: "37 * * * *"
  workflow_dispatch:        # the heartbeat's trigger, and yours from the Actions tab

# Needed so the job is allowed to push its commit back into the repo.
permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The branch as it is now, not the commit that triggered the run. Runs
      # queue behind each other (see concurrency above), and a queued run
      # would otherwise start from a checkout that predates the run it waited
      # for. On 29 September 2026 the fallback queued behind the heartbeat's
      # run, woke up on the older commit, could not see the reading taken
      # two minutes earlier, and collected a duplicate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only GitHub's own schedule is gated. A dispatch -- from the heartbeat or
      # from you -- always runs. If the heartbeat already collected this hour,
      # the fallback stands down instead of taking a duplicate reading.
      - name: Gate
        id: gate
        if: github.event_name == 'schedule'
        run: python collect.py --gate

      - name: Collect snapshot
        if: steps.gate.outputs.run != 'false'
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_VIDEO_IDS: ${{ vars.YOUTUBE_VIDEO_IDS }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          SELFREPORT_URL: ${{ vars.SELFREPORT_URL }}
        run: python collect.py

      - name: Summarise into public/
        if: steps.gate.outputs.run != 'false'
        run: python summarise.py

      # STATE.md is the file that exists so nothing about this project has to
      # be remembered, and it was the one file nothing regenerated. It only
      # refreshed when somebody happened to run state.py by hand, so it sat
      # seven hours stale while claiming in its own first line to be current.
      # A status report that is only true when someone remembers to make it
      # true is the thing this project replaced.
      - name: Refresh STATE.md
        if: steps.gate.outputs.run != 'false'
        continue-on-error: true
        run: python state.py

      - name: Commit snapshot
        if: steps.gate.outputs.run != 'false'
        run: |
          git config user.name  "attention-heist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ public/ STATE.md
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "snapshot $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Another run may have landed while we were working - rebase, retry.
          #
          # Snapshots never collide: every run writes its own file. Only the
          # generated files can (public/, STATE.md), and when they did, the old
          # loop could not recover -- the rebase stopped on the conflict and
          # every retry failed on "unmerged files", losing the reading. So on
          # a clash keep ours, then rebuild them over the combined history.
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; then
              python summarise.py && { python state.py || true; }
              git add public/ STATE.md
              git diff --staged --quiet || git commit -q --amend --no-edit
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else
              git rebase --abort || true
            fi
            echo "push failed, retrying ($i)"
            sleep 5
          done
          exit 1

      # Runs after the snapshot is safely committed, so a failure here never
      # costs us data - it only makes GitHub send an email.
      - name: Health check
        if: steps.gate.outputs.run != 'false'
        run: python collect.py --check
