name: backfill

# Run by hand only. This fetches history, and history does not change,
# so there is nothing to gain from running it on a schedule.
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Fetch history from this date (YYYY-MM-DD)"
        required: false
        default: "2023-01-01"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch history
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python backfill.py "${{ inputs.start_date }}"

      - name: Commit history
        run: |
          git config user.name  "attention-heist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/backfill/
          if git diff --staged --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "backfill from ${{ inputs.start_date }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
